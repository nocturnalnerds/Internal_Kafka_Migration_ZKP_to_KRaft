apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  template:
    spec:
      containers:
        - name: kafka
          env:
            - name: KAFKA_PROCESS_ROLES
              value: broker
            - name: KAFKA_NODE_ID_COMMAND
              value: "expr ${HOSTNAME##*-} + 1"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-cluster-settings
                  key: CONTROLLER_QUORUM_VOTERS
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: ""
            - name: KAFKA_ZOOKEEPER_METADATA_MIGRATION_ENABLE
              value: "false"

