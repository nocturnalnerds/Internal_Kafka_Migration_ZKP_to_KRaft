apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: kafka-secure-patch.yaml

secretGenerator:
  - name: kafka-security-settings
    literals:
      - broker-password=broker-secret
      - admin-password=admin-secret
      - broker-jaas-config=org.apache.kafka.common.security.scram.ScramLoginModule required username="broker" password="broker-secret";
