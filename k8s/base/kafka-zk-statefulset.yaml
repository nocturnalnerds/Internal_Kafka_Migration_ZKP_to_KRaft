apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: kafka-migration-lab
spec:
  serviceName: kafka-headless
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/component: broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: broker
        app.kubernetes.io/part-of: kafka-migration-lab
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.7.1
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -ec
            - |
              ordinal="${HOSTNAME##*-}"
              export KAFKA_BROKER_ID="$((ordinal + 1))"
              export KAFKA_ADVERTISED_LISTENERS="INTERNAL://${HOSTNAME}.kafka-headless.kafka-migration.svc.cluster.local:9092"
              exec /etc/confluent/docker/run
          ports:
            - name: internal
              containerPort: 9092
            - name: jmx
              containerPort: 9101
          env:
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: zookeeper-0.zookeeper-headless.kafka-migration.svc.cluster.local:2181,zookeeper-1.zookeeper-headless.kafka-migration.svc.cluster.local:2181,zookeeper-2.zookeeper-headless.kafka-migration.svc.cluster.local:2181/kafka
            - name: KAFKA_LISTENERS
              value: INTERNAL://0.0.0.0:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: INTERNAL:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              valueFrom:
                configMapKeyRef:
                  name: kafka-cluster-settings
                  key: KAFKA_DEFAULT_REPLICATION_FACTOR
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              valueFrom:
                configMapKeyRef:
                  name: kafka-cluster-settings
                  key: KAFKA_DEFAULT_REPLICATION_FACTOR
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              valueFrom:
                configMapKeyRef:
                  name: kafka-cluster-settings
                  key: KAFKA_MIN_INSYNC_REPLICAS
            - name: KAFKA_MIN_INSYNC_REPLICAS
              valueFrom:
                configMapKeyRef:
                  name: kafka-cluster-settings
                  key: KAFKA_MIN_INSYNC_REPLICAS
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              valueFrom:
                configMapKeyRef:
                  name: kafka-cluster-settings
                  key: KAFKA_DEFAULT_REPLICATION_FACTOR
            - name: KAFKA_NUM_PARTITIONS
              valueFrom:
                configMapKeyRef:
                  name: kafka-cluster-settings
                  key: KAFKA_DEFAULT_PARTITIONS
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              valueFrom:
                configMapKeyRef:
                  name: kafka-cluster-settings
                  key: KAFKA_AUTO_CREATE_TOPICS_ENABLE
            - name: KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE
              valueFrom:
                configMapKeyRef:
                  name: kafka-cluster-settings
                  key: KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE
            - name: KAFKA_LOG_RETENTION_HOURS
              valueFrom:
                configMapKeyRef:
                  name: kafka-cluster-settings
                  key: KAFKA_LOG_RETENTION_HOURS
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_JMX_PORT
              value: "9101"
            - name: KAFKA_JMX_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            exec:
              command:
                - bash
                - -ec
                - kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - bash
                - -ec
                - kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi

