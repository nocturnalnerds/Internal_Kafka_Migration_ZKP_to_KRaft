apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/part-of: kafka-migration-lab
spec:
  serviceName: zookeeper-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zookeeper
        app.kubernetes.io/part-of: kafka-migration-lab
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.7.1
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -ec
            - |
              ordinal="${HOSTNAME##*-}"
              export ZOOKEEPER_SERVER_ID="$((ordinal + 1))"
              exec /etc/confluent/docker/run
          ports:
            - name: client
              containerPort: 2181
            - name: peer
              containerPort: 2888
            - name: election
              containerPort: 3888
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
            - name: ZOOKEEPER_INIT_LIMIT
              value: "10"
            - name: ZOOKEEPER_SYNC_LIMIT
              value: "5"
            - name: ZOOKEEPER_SERVERS
              value: zookeeper-0.zookeeper-headless.kafka-migration.svc.cluster.local:2888:3888;zookeeper-1.zookeeper-headless.kafka-migration.svc.cluster.local:2888:3888;zookeeper-2.zookeeper-headless.kafka-migration.svc.cluster.local:2888:3888
            - name: KAFKA_OPTS
              value: -Dzookeeper.4lw.commands.whitelist=ruok,mntr,stat,conf
          readinessProbe:
            exec:
              command:
                - bash
                - -ec
                - echo ruok | nc -w 2 localhost 2181 | grep imok
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - bash
                - -ec
                - echo ruok | nc -w 2 localhost 2181 | grep imok
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/zookeeper/data
            - name: log
              mountPath: /var/lib/zookeeper/log
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: log
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

