apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kraft-controller
  labels:
    app.kubernetes.io/name: kraft-controller
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: kafka-migration-lab
spec:
  serviceName: kraft-controller-headless
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: kraft-controller
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kraft-controller
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: kafka-migration-lab
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.7.1
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -ec
            - |
              ordinal="${HOSTNAME##*-}"
              export KAFKA_NODE_ID="$((ordinal + 101))"
              exec /etc/confluent/docker/run
          ports:
            - name: controller
              containerPort: 9093
            - name: jmx
              containerPort: 9101
          env:
            - name: KAFKA_PROCESS_ROLES
              value: controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-cluster-settings
                  key: CONTROLLER_QUORUM_VOTERS
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT
            - name: KAFKA_LISTENERS
              value: CONTROLLER://0.0.0.0:9093
            - name: KAFKA_METADATA_LOG_DIR
              value: /var/lib/kafka/metadata
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: zookeeper-0.zookeeper-headless.kafka-migration.svc.cluster.local:2181,zookeeper-1.zookeeper-headless.kafka-migration.svc.cluster.local:2181,zookeeper-2.zookeeper-headless.kafka-migration.svc.cluster.local:2181/kafka
            - name: KAFKA_ZOOKEEPER_METADATA_MIGRATION_ENABLE
              value: "true"
            - name: KAFKA_JMX_PORT
              value: "9101"
            - name: KAFKA_JMX_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            exec:
              command:
                - bash
                - -ec
                - kafka-metadata-quorum --bootstrap-controller localhost:9093 describe --status >/dev/null
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - bash
                - -ec
                - kafka-metadata-quorum --bootstrap-controller localhost:9093 describe --status >/dev/null
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi

