bootstrap.servers=localhost:19092,localhost:19093,localhost:19094
security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="orders-producer" password="orders-producer-secret";
ssl.truststore.location=security/certs/generated/kafka.truststore.jks
ssl.truststore.password=changeit
ssl.endpoint.identification.algorithm=
client.id=orders-producer
acks=all
enable.idempotence=true

