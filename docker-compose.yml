name: kafka-zk-kraft

x-kafka-common: &kafka-common
  image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:7.7.1}
  restart: unless-stopped
  depends_on:
    zookeeper-1:
      condition: service_healthy
    zookeeper-2:
      condition: service_healthy
    zookeeper-3:
      condition: service_healthy
  networks:
    - kafka-net

x-kafka-zk-env: &kafka-zk-env
  KAFKA_ZOOKEEPER_CONNECT: ${ZOOKEEPER_CONNECT:-zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181/kafka}
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_DEFAULT_REPLICATION_FACTOR:-3}
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_DEFAULT_REPLICATION_FACTOR:-3}
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_MIN_INSYNC_REPLICAS:-2}
  KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_INSYNC_REPLICAS:-2}
  KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_DEFAULT_REPLICATION_FACTOR:-3}
  KAFKA_NUM_PARTITIONS: ${KAFKA_DEFAULT_PARTITIONS:-6}
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DELETE_TOPIC_ENABLE: "true"
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-168}
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_JMX_PORT: 9101

x-zookeeper-healthcheck: &zookeeper-healthcheck
  test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
  interval: 10s
  timeout: 5s
  retries: 18
  start_period: 20s

x-kafka-healthcheck: &kafka-healthcheck
  test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
  interval: 15s
  timeout: 10s
  retries: 20
  start_period: 45s

x-controller-healthcheck: &controller-healthcheck
  test: ["CMD-SHELL", "kafka-metadata-quorum --bootstrap-controller localhost:9093 describe --status >/dev/null 2>&1"]
  interval: 15s
  timeout: 10s
  retries: 20
  start_period: 45s

services:
  zookeeper-1:
    image: ${ZOOKEEPER_IMAGE:-confluentinc/cp-zookeeper:7.7.1}
    hostname: zookeeper-1
    container_name: zookeeper-1
    restart: unless-stopped
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      KAFKA_OPTS: -Dzookeeper.4lw.commands.whitelist=ruok,mntr,stat,conf
    volumes:
      - zookeeper-1-data:/var/lib/zookeeper/data
      - zookeeper-1-log:/var/lib/zookeeper/log
    healthcheck: *zookeeper-healthcheck
    networks:
      - kafka-net

  zookeeper-2:
    image: ${ZOOKEEPER_IMAGE:-confluentinc/cp-zookeeper:7.7.1}
    hostname: zookeeper-2
    container_name: zookeeper-2
    restart: unless-stopped
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      KAFKA_OPTS: -Dzookeeper.4lw.commands.whitelist=ruok,mntr,stat,conf
    volumes:
      - zookeeper-2-data:/var/lib/zookeeper/data
      - zookeeper-2-log:/var/lib/zookeeper/log
    healthcheck: *zookeeper-healthcheck
    networks:
      - kafka-net

  zookeeper-3:
    image: ${ZOOKEEPER_IMAGE:-confluentinc/cp-zookeeper:7.7.1}
    hostname: zookeeper-3
    container_name: zookeeper-3
    restart: unless-stopped
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      KAFKA_OPTS: -Dzookeeper.4lw.commands.whitelist=ruok,mntr,stat,conf
    volumes:
      - zookeeper-3-data:/var/lib/zookeeper/data
      - zookeeper-3-log:/var/lib/zookeeper/log
    healthcheck: *zookeeper-healthcheck
    networks:
      - kafka-net

  kafka-1:
    <<: *kafka-common
    hostname: kafka-1
    container_name: kafka-1
    ports:
      - "19092:19092"
      - "9101:9101"
    environment:
      <<: *kafka-zk-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092
      KAFKA_JMX_HOSTNAME: kafka-1
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  kafka-2:
    <<: *kafka-common
    hostname: kafka-2
    container_name: kafka-2
    ports:
      - "19093:19093"
      - "9102:9101"
    environment:
      <<: *kafka-zk-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:19093
      KAFKA_JMX_HOSTNAME: kafka-2
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  kafka-3:
    <<: *kafka-common
    hostname: kafka-3
    container_name: kafka-3
    ports:
      - "19094:19094"
      - "9103:9101"
    environment:
      <<: *kafka-zk-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:19094
      KAFKA_JMX_HOSTNAME: kafka-3
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  kraft-controller-1:
    image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:7.7.1}
    hostname: kraft-controller-1
    container_name: kraft-controller-1
    restart: unless-stopped
    profiles: ["migration"]
    depends_on:
      zookeeper-1:
        condition: service_healthy
      zookeeper-2:
        condition: service_healthy
      zookeeper-3:
        condition: service_healthy
    environment:
      KAFKA_NODE_ID: 101
      KAFKA_PROCESS_ROLES: controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${CONTROLLER_QUORUM_VOTERS:-101@kraft-controller-1:9093,102@kraft-controller-2:9093,103@kraft-controller-3:9093}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/metadata
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_ZOOKEEPER_CONNECT: ${ZOOKEEPER_CONNECT:-zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181/kafka}
      KAFKA_ZOOKEEPER_METADATA_MIGRATION_ENABLE: "true"
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kraft-controller-1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
    volumes:
      - kraft-controller-1-data:/var/lib/kafka
    healthcheck: *controller-healthcheck
    networks:
      - kafka-net

  kraft-controller-2:
    image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:7.7.1}
    hostname: kraft-controller-2
    container_name: kraft-controller-2
    restart: unless-stopped
    profiles: ["migration"]
    depends_on:
      zookeeper-1:
        condition: service_healthy
      zookeeper-2:
        condition: service_healthy
      zookeeper-3:
        condition: service_healthy
    environment:
      KAFKA_NODE_ID: 102
      KAFKA_PROCESS_ROLES: controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${CONTROLLER_QUORUM_VOTERS:-101@kraft-controller-1:9093,102@kraft-controller-2:9093,103@kraft-controller-3:9093}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/metadata
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_ZOOKEEPER_CONNECT: ${ZOOKEEPER_CONNECT:-zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181/kafka}
      KAFKA_ZOOKEEPER_METADATA_MIGRATION_ENABLE: "true"
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kraft-controller-2
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
    volumes:
      - kraft-controller-2-data:/var/lib/kafka
    healthcheck: *controller-healthcheck
    networks:
      - kafka-net

  kraft-controller-3:
    image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:7.7.1}
    hostname: kraft-controller-3
    container_name: kraft-controller-3
    restart: unless-stopped
    profiles: ["migration"]
    depends_on:
      zookeeper-1:
        condition: service_healthy
      zookeeper-2:
        condition: service_healthy
      zookeeper-3:
        condition: service_healthy
    environment:
      KAFKA_NODE_ID: 103
      KAFKA_PROCESS_ROLES: controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${CONTROLLER_QUORUM_VOTERS:-101@kraft-controller-1:9093,102@kraft-controller-2:9093,103@kraft-controller-3:9093}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/metadata
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_ZOOKEEPER_CONNECT: ${ZOOKEEPER_CONNECT:-zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181/kafka}
      KAFKA_ZOOKEEPER_METADATA_MIGRATION_ENABLE: "true"
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kraft-controller-3
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
    volumes:
      - kraft-controller-3-data:/var/lib/kafka
    healthcheck: *controller-healthcheck
    networks:
      - kafka-net

  kafka-init:
    image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:7.7.1}
    container_name: kafka-init
    profiles: ["tools"]
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    command: ["/opt/kafka-lab/create-topics.sh"]
    volumes:
      - ./docker/scripts/create-topics.sh:/opt/kafka-lab/create-topics.sh:ro
      - ./docker/kafka/client.properties:/opt/kafka-lab/client.properties:ro
    networks:
      - kafka-net

networks:
  kafka-net:
    driver: bridge

volumes:
  zookeeper-1-data:
  zookeeper-1-log:
  zookeeper-2-data:
  zookeeper-2-log:
  zookeeper-3-data:
  zookeeper-3-log:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  kraft-controller-1-data:
  kraft-controller-2-data:
  kraft-controller-3-data:

